<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Learning and answering are different</title><desc id="desc">A neural network processes numbers through layers.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="520" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">Learning and answering are different</text><text x="28" y="72" font-size="19" fill="#a6b5c9">A neural network processes numbers through layers.</text><rect x="28" y="108" width="664" height="120" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="142" font-size="23" fill="#38bdf8">TRAINING / change the numbers</text><text x="46" y="173" font-size="20" fill="#e2e8f0">Predict → measure error → adjust parameters → repeat</text><text x="46" y="200" font-size="20" fill="#e2e8f0">Examples connect OOMKilled with memory problems.</text><rect x="28" y="256" width="664" height="120" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="46" y="290" font-size="23" fill="#a78bfa">INFERENCE / use the numbers</text><text x="46" y="321" font-size="20" fill="#e2e8f0">Pod question + learned parameters → explanation</text><text x="46" y="348" font-size="20" fill="#e2e8f0">The weights normally stay fixed.</text><text x="30" y="418" font-size="26" fill="#e2e8f0">2B parameters ≈ 2,000,000,000 learned numbers</text><text x="30" y="458" font-size="22" fill="#a6b5c9">Parameter count is capacity, not a quality score.</text><text x="28" y="500" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>