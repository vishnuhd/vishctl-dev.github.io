<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 675" role="img" aria-labelledby="title desc"><title id="title">Four ideas, four different jobs</title><desc id="desc">Follow our pod question through different model layouts.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="675" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">Four ideas, four different jobs</text><text x="28" y="72" font-size="19" fill="#a6b5c9">Follow our pod question through different model layouts.</text><rect x="28" y="110" width="664" height="104" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="144" font-size="23" fill="#38bdf8">TENSOR PARALLELISM / split a layer</text><text x="46" y="175" font-size="20" fill="#e2e8f0">One layer: GPU 1 does part + GPU 2 does part</text><text x="46" y="202" font-size="20" fill="#e2e8f0">Combine results, then continue.</text><rect x="28" y="236" width="664" height="104" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="270" font-size="23" fill="#38bdf8">PIPELINE PARALLELISM / split layers</text><text x="46" y="301" font-size="20" fill="#e2e8f0">GPU 1: early layers → GPU 2: later layers</text><text x="46" y="328" font-size="20" fill="#e2e8f0">Work flows through stages.</text><rect x="28" y="362" width="664" height="104" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="396" font-size="23" fill="#38bdf8">DATA PARALLELISM / replicate for serving</text><text x="46" y="427" font-size="20" fill="#e2e8f0">Our question → copy 1    Another request → copy 2</text><text x="46" y="454" font-size="20" fill="#e2e8f0">Copies serve different requests.</text><rect x="28" y="488" width="664" height="132" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="46" y="522" font-size="23" fill="#a78bfa">MIXTURE OF EXPERTS / select work</text><text x="46" y="553" font-size="20" fill="#e2e8f0">Our token → router → experts 2 and 7 → combine</text><text x="46" y="580" font-size="20" fill="#e2e8f0">Only a subset of experts runs for each token.</text><text x="46" y="607" font-size="20" fill="#e2e8f0">The other weights still need storage.</text><text x="28" y="655" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>