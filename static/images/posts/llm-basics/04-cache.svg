<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-labelledby="title desc"><title id="title">Read the prompt, then continue</title><desc id="desc">The cache avoids recomputing earlier keys and values.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="610" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">Read the prompt, then continue</text><text x="28" y="72" font-size="19" fill="#a6b5c9">The cache avoids recomputing earlier keys and values.</text><rect x="28" y="107" width="664" height="100" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="141" font-size="23" fill="#38bdf8">CONTEXT / what is available now</text><text x="46" y="172" font-size="20" fill="#e2e8f0">Pod question + OOMKilled clue + generated explanation</text><rect x="28" y="239" width="310" height="140" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="273" font-size="23" fill="#38bdf8">PREFILL</text><text x="46" y="304" font-size="20" fill="#e2e8f0">Read our pod question</text><text x="46" y="331" font-size="20" fill="#e2e8f0">Cache prompt K and V</text><text x="46" y="358" font-size="20" fill="#e2e8f0">Score the first output token</text><rect x="382" y="239" width="310" height="140" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="400" y="273" font-size="23" fill="#a78bfa">DECODE</text><text x="400" y="304" font-size="20" fill="#e2e8f0">Reuse cached K and V</text><text x="400" y="331" font-size="20" fill="#e2e8f0">Continue: The container...</text><text x="400" y="358" font-size="20" fill="#e2e8f0">Extend the cache</text><path d="M342 307 L378 307" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="412" width="664" height="100" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="446" font-size="23" fill="#38bdf8">KV CACHE / reusable attention data</text><text x="46" y="477" font-size="20" fill="#e2e8f0">Longer sequences and more active requests need space.</text><text x="30" y="552" font-size="23" fill="#a6b5c9">Context limit ≠ learned knowledge ≠ permanent memory</text><text x="28" y="590" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>