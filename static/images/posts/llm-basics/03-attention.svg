<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 594" role="img" aria-labelledby="title desc"><title id="title">Attention connects context</title><desc id="desc">Illustrative relationship, not a measured attention map.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="594" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">Attention connects context</text><text x="28" y="72" font-size="19" fill="#a6b5c9">Illustrative relationship, not a measured attention map.</text><rect x="28" y="106" width="664" height="100" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="140" font-size="23" fill="#38bdf8">Why did my Kubernetes pod restart?</text><text x="46" y="171" font-size="20" fill="#e2e8f0">Clue supplied in the prompt: OOMKilled</text><rect x="28" y="239" width="205" height="132" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="273" font-size="23" fill="#38bdf8">QUERY</text><text x="46" y="304" font-size="20" fill="#e2e8f0">Match relevant</text><text x="46" y="331" font-size="20" fill="#e2e8f0">context</text><rect x="257" y="239" width="205" height="132" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="275" y="273" font-size="23" fill="#38bdf8">KEYS</text><text x="275" y="304" font-size="20" fill="#e2e8f0">What the clue</text><text x="275" y="331" font-size="20" fill="#e2e8f0">can match</text><rect x="486" y="239" width="205" height="132" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="504" y="273" font-size="23" fill="#38bdf8">VALUES</text><text x="504" y="304" font-size="20" fill="#e2e8f0">Information</text><text x="504" y="331" font-size="20" fill="#e2e8f0">to combine</text><text x="35" y="414" font-size="25" fill="#67e8f9">Compare Q with K → attention weights → mix V</text><rect x="28" y="449" width="664" height="95" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="46" y="483" font-size="23" fill="#a78bfa">Then repeat through more layers</text><text x="46" y="514" font-size="20" fill="#e2e8f0">These are vectors, not a literal lookup table.</text><text x="28" y="574" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>