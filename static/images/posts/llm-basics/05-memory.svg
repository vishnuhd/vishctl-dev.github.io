<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" role="img" aria-labelledby="title desc"><title id="title">Our 2B model, fewer bits</title><desc id="desc">Ideal weight storage only. This is not total VRAM usage.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="630" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">Our 2B model, fewer bits</text><text x="28" y="72" font-size="19" fill="#a6b5c9">Ideal weight storage only. This is not total VRAM usage.</text><text x="28" y="140" font-size="21" fill="#e2e8f0">FP32</text><rect x="195" y="115" width="384" height="36" rx="6" fill="#38bdf8"/><text x="589" y="141" font-size="21" fill="#e2e8f0">8 GB</text><text x="28" y="220" font-size="21" fill="#e2e8f0">FP16 / BF16</text><rect x="195" y="195" width="192" height="36" rx="6" fill="#67e8f9"/><text x="397" y="221" font-size="21" fill="#e2e8f0">4 GB</text><text x="28" y="300" font-size="21" fill="#e2e8f0">8-bit</text><rect x="195" y="275" width="96" height="36" rx="6" fill="#a78bfa"/><text x="301" y="301" font-size="21" fill="#e2e8f0">2 GB</text><text x="28" y="380" font-size="21" fill="#e2e8f0">4-bit</text><rect x="195" y="355" width="48" height="36" rx="6" fill="#fbbf24"/><text x="253" y="381" font-size="21" fill="#e2e8f0">1 GB</text><rect x="28" y="455" width="664" height="125" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="489" font-size="23" fill="#38bdf8">TOTAL MEMORY = more than weights</text><text x="46" y="520" font-size="20" fill="#e2e8f0">Weights + KV cache + temporary calculations + runtime</text><text x="46" y="547" font-size="20" fill="#e2e8f0">GB here is decimal. Bars exclude format overhead.</text><text x="28" y="610" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>