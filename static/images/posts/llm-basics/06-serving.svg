<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 656" role="img" aria-labelledby="title desc"><title id="title">Serving more than one conversation</title><desc id="desc">A = our pod question. B, C, D, E = other requests.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="656" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">Serving more than one conversation</text><text x="28" y="72" font-size="19" fill="#a6b5c9">A = our pod question. B, C, D, E = other requests.</text><text x="28" y="120" font-size="23" fill="#38bdf8">CONTINUOUS BATCHING</text><text x="30" y="175" font-size="21" fill="#e2e8f0">Step 1</text><rect x="150" y="142" width="120" height="54" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="168" y="176" font-size="23" fill="#38bdf8">A</text><rect x="295" y="142" width="120" height="54" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="313" y="176" font-size="23" fill="#38bdf8">B</text><rect x="440" y="142" width="120" height="54" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="458" y="176" font-size="23" fill="#38bdf8">C</text><text x="30" y="248" font-size="21" fill="#e2e8f0">Step 2</text><rect x="150" y="215" width="120" height="54" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="168" y="249" font-size="23" fill="#38bdf8">A</text><rect x="295" y="215" width="120" height="54" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="313" y="249" font-size="23" fill="#a78bfa">D</text><rect x="440" y="215" width="120" height="54" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="458" y="249" font-size="23" fill="#38bdf8">C</text><text x="30" y="321" font-size="21" fill="#e2e8f0">Step 3</text><rect x="150" y="288" width="120" height="54" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="168" y="322" font-size="23" fill="#a78bfa">E</text><rect x="295" y="288" width="120" height="54" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="313" y="322" font-size="23" fill="#a78bfa">D</text><rect x="440" y="288" width="120" height="54" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="458" y="322" font-size="23" fill="#38bdf8">C</text><text x="30" y="385" font-size="22" fill="#e2e8f0">B ends → D joins. Our request A keeps generating.</text><text x="28" y="440" font-size="23" fill="#38bdf8">PAGED KV CACHE</text><text x="28" y="478" font-size="22" fill="#e2e8f0">Request A → blocks 1, 4       Request B → blocks 2, 5</text><rect x="28" y="502" width="116" height="57" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="536" font-size="23" fill="#38bdf8">A:1</text><rect x="165" y="502" width="116" height="57" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="183" y="536" font-size="23" fill="#38bdf8">B:2</text><rect x="302" y="502" width="116" height="57" rx="12" fill="#172333" stroke="#8092ac" stroke-width="1.5"/><text x="320" y="536" font-size="23" fill="#8092ac">free</text><rect x="439" y="502" width="116" height="57" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="457" y="536" font-size="23" fill="#38bdf8">A:4</text><rect x="576" y="502" width="116" height="57" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="594" y="536" font-size="23" fill="#38bdf8">B:5</text><text x="28" y="601" font-size="22" fill="#a6b5c9">Logical order can map to scattered physical blocks.</text><text x="28" y="636" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>