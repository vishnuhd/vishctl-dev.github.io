<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="title desc"><title id="title">From prompt to next token</title><desc id="desc">Same request, with the OOMKilled clue</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="720" height="580" rx="16" fill="#101722"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" font-size="28" fill="#e2e8f0">From prompt to next token</text><text x="28" y="72" font-size="19" fill="#a6b5c9">Same request, with the OOMKilled clue</text><rect x="28" y="102" width="664" height="80" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="136" font-size="23" fill="#38bdf8">Prompt</text><text x="155" y="152" font-size="23" fill="#e2e8f0">Why did my Kubernetes pod restart?</text><path d="M360 184 L360 210" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="28" y="214" width="310" height="115" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="248" font-size="23" fill="#38bdf8">1 / Tokenize</text><text x="46" y="279" font-size="20" fill="#e2e8f0">Text pieces become IDs</text><text x="46" y="306" font-size="20" fill="#e2e8f0">Exact splits vary by tokenizer</text><rect x="382" y="214" width="310" height="115" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="400" y="248" font-size="23" fill="#38bdf8">2 / Embed</text><text x="400" y="279" font-size="20" fill="#e2e8f0">IDs become vectors</text><text x="400" y="306" font-size="20" fill="#e2e8f0">Add position information</text><path d="M340 270 L378 270" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M538 332 L538 361" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="382" y="365" width="310" height="115" rx="12" fill="#172333" stroke="#38bdf8" stroke-width="1.5"/><text x="400" y="399" font-size="23" fill="#38bdf8">3 / Transformer</text><text x="400" y="430" font-size="20" fill="#e2e8f0">Attention + other maths</text><text x="400" y="457" font-size="20" fill="#e2e8f0">Repeat across layers</text><rect x="28" y="365" width="310" height="115" rx="12" fill="#172333" stroke="#a78bfa" stroke-width="1.5"/><text x="46" y="399" font-size="23" fill="#a78bfa">4 / Choose a token</text><text x="46" y="430" font-size="20" fill="#e2e8f0">Scores become probabilities</text><text x="46" y="457" font-size="20" fill="#e2e8f0">Example output: The</text><path d="M378 423 L342 423" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="30" y="522" font-size="22" fill="#67e8f9">Append the chosen token, then repeat until stopping.</text><text x="28" y="560" font-size="16" fill="#8092ac">vishctl / LLM field notes</text></g></svg>