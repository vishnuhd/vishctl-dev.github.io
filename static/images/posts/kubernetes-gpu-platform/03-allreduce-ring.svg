<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">AllReduce: every GPU contributes and every GPU gets the result</title>
  <desc id="d">Four GPUs hold the values 1, 2, 3 and 4. Dots circulate around a ring between them. After the animation cycle, each GPU shows the same reduced result, 10.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .gpu { fill: #0b1730; stroke: #22d3ee; stroke-width: 2.5; }
    .t { fill: #e6f6ff; font-size: 18px; font-weight: 650; }
    .v { fill: #67e8f9; font-size: 26px; font-weight: 700; }
    .ring { fill: none; stroke: #334d77; stroke-width: 3; stroke-dasharray: 6 8; }
    .before { opacity: 1 } .after { opacity: 0 }
    @media (prefers-reduced-motion: no-preference) {
      .before { animation: b 8s infinite } .after { animation: a 8s infinite }
      @keyframes b { 0%,45% { opacity: 1 } 55%,95% { opacity: 0 } 100% { opacity: 1 } }
      @keyframes a { 0%,45% { opacity: 0 } 55%,95% { opacity: 1 } 100% { opacity: 0 } }
    }
    @media (prefers-reduced-motion: reduce) { circle { display: none; } .before { opacity: 0; } .after { opacity: 1; } }
  </style>
  <rect width="800" height="440" rx="20" fill="#081225"/>
  <text x="400" y="44" text-anchor="middle" fill="#e6f6ff" font-size="26" font-weight="650">Sum AllReduce, in one picture</text>
  <path id="r" class="ring" d="M250 130H550V330H250Z"/>
  <g id="gp">
    <rect class="gpu" x="190" y="100" width="120" height="60" rx="12"/><text class="t" x="250" y="124" text-anchor="middle">GPU 0</text>
    <rect class="gpu" x="490" y="100" width="120" height="60" rx="12"/><text class="t" x="550" y="124" text-anchor="middle">GPU 1</text>
    <rect class="gpu" x="490" y="300" width="120" height="60" rx="12"/><text class="t" x="550" y="324" text-anchor="middle">GPU 2</text>
    <rect class="gpu" x="190" y="300" width="120" height="60" rx="12"/><text class="t" x="250" y="324" text-anchor="middle">GPU 3</text>
  </g>
  <g class="before">
    <text class="v" x="250" y="152" text-anchor="middle">1</text><text class="v" x="550" y="152" text-anchor="middle">2</text>
    <text class="v" x="550" y="352" text-anchor="middle">3</text><text class="v" x="250" y="352" text-anchor="middle">4</text>
    <text fill="#9db4d6" font-size="16" x="400" y="236" text-anchor="middle" font-family="system-ui">inputs: 1, 2, 3, 4 → sum: 10 on every GPU</text>
  </g>
  <g class="after">
    <text class="v" x="250" y="152" text-anchor="middle">10</text><text class="v" x="550" y="152" text-anchor="middle">10</text>
    <text class="v" x="550" y="352" text-anchor="middle">10</text><text class="v" x="250" y="352" text-anchor="middle">10</text>
    <text fill="#9db4d6" font-size="16" x="400" y="236" text-anchor="middle" font-family="system-ui">everyone now holds 1+2+3+4</text>
  </g>
  <circle r="7" fill="#38bdf8"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#r"/></animateMotion></circle>
  <circle r="7" fill="#38bdf8"><animateMotion dur="4s" repeatCount="indefinite" begin="-1s"><mpath href="#r"/></animateMotion></circle>
  <circle r="7" fill="#38bdf8"><animateMotion dur="4s" repeatCount="indefinite" begin="-2s"><mpath href="#r"/></animateMotion></circle>
  <circle r="7" fill="#38bdf8"><animateMotion dur="4s" repeatCount="indefinite" begin="-3s"><mpath href="#r"/></animateMotion></circle>
  <text x="400" y="410" text-anchor="middle" fill="#9db4d6" font-size="15" font-family="system-ui">If the links between GPUs are slow, all four wait. That is why interconnects matter.</text>
</svg>
