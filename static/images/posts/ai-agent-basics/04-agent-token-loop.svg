<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent loop at the token level</title>
  <desc id="desc">A vertical sequence from prompt to model, tool call, harness tool execution, and tool result, which loops back to the model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#45d6ff"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ad86ff"/>
    </marker>
  </defs>

  <rect width="1200" height="900" rx="28" fill="#091426"/>
  <rect x="84" y="52" width="1032" height="796" rx="24" fill="#0d1d33" stroke="#223b59" stroke-width="2"/>

  <g fill="none" stroke="#45d6ff" stroke-width="5" marker-end="url(#arrow)">
    <path d="M600 178V230"/>
    <path d="M600 340V392"/>
    <path d="M600 502V554"/>
    <path d="M600 684V736"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <rect x="410" y="92" width="380" height="86" rx="18" fill="#122a46" stroke="#45d6ff" stroke-width="3"/>
    <text x="600" y="145" fill="#e7f4ff" font-size="28" font-weight="750">Prompt In</text>

    <rect x="410" y="230" width="380" height="110" rx="18" fill="#122a46" stroke="#45d6ff" stroke-width="3"/>
    <text x="600" y="296" fill="#e7f4ff" font-size="30" font-weight="750">Model</text>

    <rect x="410" y="392" width="380" height="110" rx="18" fill="#122a46" stroke="#45d6ff" stroke-width="3"/>
    <text x="600" y="458" fill="#e7f4ff" font-size="28" font-weight="750">Tool Call</text>

    <rect x="370" y="554" width="460" height="130" rx="18" fill="#3b2c12" stroke="#ffc857" stroke-width="3"/>
    <text x="600" y="610" fill="#ffe4a3" font-size="27" font-weight="750">Harness Executes Tool</text>
    <text x="600" y="648" fill="#d7bb75" font-size="19">outside the model</text>

    <rect x="410" y="736" width="380" height="86" rx="18" fill="#122a46" stroke="#45d6ff" stroke-width="3"/>
    <text x="600" y="789" fill="#e7f4ff" font-size="28" font-weight="750">Tool Result</text>
  </g>

  <path d="M790 779 H954 Q1000 779 1000 733 V330 Q1000 285 955 285 H810"
        fill="none" stroke="#ad86ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-arrow)"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="899" y="505" width="151" height="50" rx="25" fill="#251b42" stroke="#ad86ff" stroke-width="2"/>
    <text x="974" y="537" fill="#d8c7ff" font-size="21" font-weight="750" text-anchor="middle">Repeat</text>
  </g>
</svg>
