apiVersion: v1
kind: Namespace
metadata:
  name: temporal
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-db
  namespace: temporal
stringData:
  password: temporal-demo-pw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: temporal-db, key: password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: temporal
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
