baseURL = "https://vishctl.dev/"
languageCode = "en-us"
title = "vishctl"
theme = "PaperMod"

[params]
  env = "production"
  description = "Notes on infra, Kubernetes, and AI systems"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "Welcome to vishctl"
    Content = "A pun on my name + `kubectl`. Here I share practical notes and experiments across Kubernetes, DevOps, AI infrastructure, and continuous learning. Authentic write-ups from the trenches so neither of us has to solve the same headache twice."

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/vishnuhd/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vishnuhd"

  [[params.socialIcons]]
    name = "link"
    url = "https://own.page/vishnuhd"
    title = "own.page"

[outputs]
  home = ["HTML", "RSS", "JSON"]
