baseURL = "https://vishctl.dev/"
languageCode = "en-us"
title = "vishctl"
theme = "PaperMod"

[params]
  env = "production"
  description = "Notes on infra, Kubernetes, and AI systems"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowAllPagesInArchive = true
  mainSections = ["posts"]

  [params.label]
    text = "vishctl"
    iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>'

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.homeInfoParams]
    Title = "Welcome to vishctl"
    Content = "A play on my name + `kubectl`. Here I share practical notes and experiments across Kubernetes, DevOps, AI infrastructure, and continuous learning. Authentic write-ups from the trenches so neither of us has to solve the same headache twice."

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/vishnuhd/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vishnuhd"

  [[params.socialIcons]]
    name = "link"
    url = "https://own.page/vishnuhd"
    title = "own.page"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "Archive"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 40

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
