<script>
(() => {
    const toc = document.querySelector('.post-toc');
    if (!toc) return;

    const links = Array.from(toc.querySelectorAll('.post-toc-list a[href^="#"]'));
    const sections = links.map((link) => {
        const id = decodeURIComponent(link.hash.slice(1));
        return { link, heading: document.getElementById(id) };
    }).filter((item) => item.heading);

    if (!sections.length) return;

    const list = toc.querySelector('.post-toc-list');
    const progressBar = toc.querySelector('[data-toc-progress-bar]');
    const progressText = toc.querySelector('[data-toc-progress]');
    let currentLink = null;
    let ticking = false;

    const updateToc = () => {
        const readingLine = window.scrollY + Math.min(180, window.innerHeight * 0.25);
        let current = sections[0];

        for (const section of sections) {
            if (section.heading.offsetTop <= readingLine) current = section;
            else break;
        }

        if (current.link !== currentLink) {
            sections.forEach(({ link }) => {
                const active = link === current.link;
                link.classList.toggle('is-active', active);
                if (active) link.setAttribute('aria-current', 'location');
                else link.removeAttribute('aria-current');
            });
            currentLink = current.link;

            const target = current.link.offsetTop - (list.clientHeight / 2) + (current.link.clientHeight / 2);
            list.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
        }

        const available = document.documentElement.scrollHeight - window.innerHeight;
        const progress = available > 0 ? Math.min(100, Math.max(0, (window.scrollY / available) * 100)) : 100;
        progressBar.style.width = `${progress}%`;
        progressText.textContent = `${Math.round(progress)}%`;
        ticking = false;
    };

    const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(updateToc);
    };

    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', requestUpdate);
    updateToc();
})();
</script>
