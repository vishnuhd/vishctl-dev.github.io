<div class="comments" id="comments">
    <script src="https://giscus.app/client.js"
            data-repo="vishnuhd/vishctl-dev.github.io"
            data-repo-id="R_kgDOULszuA"
            data-category="Announcements"
            data-category-id="DIC_kwDOULszuM4DE9U7"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
    <script>
        function updateGiscusTheme() {
            const isDark = document.querySelector("html").dataset.theme === "dark" || 
                           (!document.querySelector("html").dataset.theme && document.body.classList.contains("dark")) ||
                           localStorage.getItem("pref-theme") === "dark";
            const theme = isDark ? "dark" : "light";
            const iframe = document.querySelector('iframe.giscus-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: theme } } },
                    'https://giscus.app'
                );
            }
        }

        const themeToggle = document.getElementById("theme-toggle");
        if (themeToggle) {
            themeToggle.addEventListener("click", () => {
                setTimeout(updateGiscusTheme, 100);
            });
        }

        window.addEventListener("message", (event) => {
            if (event.origin !== "https://giscus.app") return;
            if (!(typeof event.data === "object" && event.data.giscus)) return;
            const prefTheme = localStorage.getItem("pref-theme");
            if (prefTheme) {
                updateGiscusTheme();
            }
        });
    </script>
</div>
