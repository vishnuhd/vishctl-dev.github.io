{{- $labScript := resources.Get "js/lab.js" | minify | fingerprint }}
<script defer src="{{ $labScript.RelPermalink }}" integrity="{{ $labScript.Data.Integrity }}"></script>

{{- $readerScript := resources.Get "js/reader.js" | minify | fingerprint }}
<script defer src="{{ $readerScript.RelPermalink }}" integrity="{{ $readerScript.Data.Integrity }}"></script>

<script type="module">
const diagrams = document.querySelectorAll('.mermaid');

if (diagrams.length) {
    const sources = new Map(Array.from(diagrams, (diagram) => [diagram, diagram.textContent.trim()]));
    try {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs');

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: 'base',
        fontFamily: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace",
        flowchart: {
            curve: 'basis',
            htmlLabels: true,
            nodeSpacing: 34,
            rankSpacing: 46,
            useMaxWidth: true
        },
        themeVariables: {
            background: '#0d1820',
            primaryColor: '#12292a',
            primaryTextColor: '#e7f7f0',
            primaryBorderColor: '#66e3b4',
            secondaryColor: '#261e52',
            secondaryTextColor: '#f1edff',
            secondaryBorderColor: '#a78bfa',
            tertiaryColor: '#302410',
            tertiaryTextColor: '#fff3cf',
            tertiaryBorderColor: '#fbbf24',
            lineColor: '#7fc9e8',
            clusterBkg: '#101e27',
            clusterBorder: '#324950',
            edgeLabelBackground: '#0d1820',
            fontSize: '15px'
        }
    });

    await document.fonts?.ready;
    await mermaid.run({ nodes: diagrams });
    } catch {
        diagrams.forEach((diagram) => {
            const message = document.createElement('p');
            message.textContent = 'Diagram preview is unavailable.';
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'View diagram source';
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = sources.get(diagram);
            code.tabIndex = 0;
            code.setAttribute('role', 'region');
            code.setAttribute('aria-label', 'Diagram source');
            pre.append(code);
            details.append(summary, pre);
            diagram.className = 'mermaid-fallback';
            diagram.replaceChildren(message, details);
        });
    }
}
</script>
