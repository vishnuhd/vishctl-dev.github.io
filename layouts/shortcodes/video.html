<figure>
  <video controls autoplay loop muted playsinline preload="metadata" style="width:100%;border-radius:8px">
    <source src="{{ .Get "src" }}" type="video/webm">
  </video>
  {{ with .Get "caption" }}<figcaption style="text-align:center;font-size:0.9em;opacity:0.8">{{ . }}</figcaption>{{ end }}
</figure>
